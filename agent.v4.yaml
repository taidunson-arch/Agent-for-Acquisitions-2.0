tools:
  - configs: []
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
    type: agent_toolset_20260401
  - configs: []
    default_config:
      enabled: true
      permission_policy:
        type: always_allow
    mcp_server_name: github
    type: mcp_toolset
skills: []
metadata:
  version: "4.0"
  engine: tools/underwrite.mjs
  evals: evals/ (12 cases; node evals/grade.mjs <runs_dir>)
